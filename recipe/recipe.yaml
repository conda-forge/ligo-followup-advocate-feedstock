schema_version: 1

context:
  name: ligo-followup-advocate
  version: "2.2.0"
  python_min: 3.11

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ef58fe149c4dce01f5b3687afb49a5336d04e5312bf9d38a67e0bf3d91d1c51d

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - ligo-followup-advocate = ligo.followup_advocate.tool:main
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - astropy-base
    - humanize >=4.15.0
    - jinja2
    - ligo-gracedb >=2.16.0
    - ligo.skymap >=1.1.1
    - numpy
    - python >=${{ python_min }}

tests:
  - files:
      recipe:
        - pytest.ini
    requirements:
      run:
        - pip
        - pytest >=8.1
        - pytest-mock
        - python ${{ python_min }}.*
    script:
      # Check metadata
      - python -m pip check
      - python -m pip show ligo-followup-advocate
      # Run test suite
      - python -m pytest -ra -v --pyargs ligo.followup_advocate
      # Check entry point
      - ligo-followup-advocate --help

about:
  summary: LIGO/Virgo Follow-up Advocate Tools
  description: |
    This package provides tools for LIGO/Virgo follow-up advocates to assist
    in tasks such as drafting astronomical bulletins for gravitational-wave
    detections.
  homepage: https://git.ligo.org/emfollow/ligo-followup-advocate
  repository: https://git.ligo.org/emfollow/ligo-followup-advocate.git
  license: GPL-2.0-or-later
  license_file: COPYING.md

extra:
  recipe-maintainers:
    - bpiotrzkowski
    - duncanmmacleod
